on:
  workflow_dispatch:
  push:
    branches:
      - "dev"
      - "main"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "test"
        run: |
          go fmt $(go list ./... | grep -v /vendor/)

  publish:
    needs: test
    outputs:
      tag_commit: ${{steps.outputs_step.outputs.tag_commit}}
      tag_latest: ${{steps.outputs_step.outputs.tag_latest}}
    if: ${{ ( github.ref == 'refs/heads/main') || ( github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set build metadata
        id: outputs_step
        run: |
          set -euo pipefail

          GITHUB_SHA_SHORT="$(echo "$GITHUB_SHA" | cut -c 1-8)"
          TAG_COMMIT="ghcr.io/realty-one/gorush:${GITHUB_SHA_SHORT}"
          TAG_LATEST="ghcr.io/realty-one/gorush:latest"

          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            TAG_COMMIT="ghcr.io/realty-one/gorush:dev-${GITHUB_SHA_SHORT}"
            TAG_LATEST="ghcr.io/realty-one/gorush:dev-latest"
          fi

          echo "$GITHUB_SHA_SHORT"
          echo "$TAG_COMMIT"
          echo "$TAG_LATEST"
          echo "tag_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag_latest=$TAG_LATEST" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{steps.outputs_step.outputs.tag_latest}}
            ${{steps.outputs_step.outputs.tag_commit}}

  deploy_prod:
    if: ${{github.ref == 'refs/heads/main'}}
    needs: publish
    permissions:
      packages: read
    uses: ./.github/workflows/deploy_prod.yml
    secrets: inherit
    with:
      tag_commit: ${{needs.publish.outputs.tag_commit}}
      tag_latest: ${{needs.publish.outputs.tag_latest}}

  deploy_dev:
    if: ${{github.ref == 'refs/heads/dev'}}
    needs: publish
    permissions:
      packages: read
    uses: ./.github/workflows/deploy_dev.yml
    secrets: inherit
    with:
      tag_commit: ${{needs.publish.outputs.tag_commit}}
      tag_latest: ${{needs.publish.outputs.tag_latest}}

