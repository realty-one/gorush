name: Deploy to dev

on:
  workflow_call:
    inputs:
      tag_commit:
        required: true
        type: string
      tag_latest:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Print envs
        run: |
          echo ${{inputs.tag_commit}}
          echo ${{inputs.tag_latest}}

      - name: SSH and deploy to services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_HOST_IP }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            IMAGE="${{ inputs.tag_commit || 'ghcr.io/realty-one/gorush:dev-latest' }}"
            echo "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE"
            docker container rm -f dev-gorush || true
            docker run -d --restart unless-stopped --network="host" --env-file=/etc/dev.realty.one/gorush/.env -v /etc/dev.realty.one/gorush/fcm.json:/mnt/fcm.json:ro -v /etc/dev.realty.one/gorush/apns.p8:/mnt/apns.p8:ro -p 127.0.0.1:8088:8088 --name dev-gorush "$IMAGE"
